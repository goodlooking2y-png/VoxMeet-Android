name: VoxMeet Backend Type Check

on:
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"
  push:
    branches:
      - main
      - work/bigo-live-ui
      - production/livekit-token-backend
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"

permissions:
  contents: read

jobs:
  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Compile backend TypeScript
        working-directory: functions
        run: npm run build
