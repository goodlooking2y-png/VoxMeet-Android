name: Build VoxMeet Live Voice APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build-livekit-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare source and integrations
        run: |
          unzip -q VoxMeet-mobile-cloud-build.zip
          mkdir -p VoxMeet/app/src/main/java/com/rakib/voxmeet
          cp overrides/MainActivity.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/MainActivity.kt
          cp overrides/LiveKitAudioManager.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/LiveKitAudioManager.kt
          cp overrides/AuthGate.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/AuthGate.kt
          cp overrides/VoxMeetDatabase.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/VoxMeetDatabase.kt
          cp firebase/google-services.json VoxMeet/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          nl = chr(10)
          root = Path("VoxMeet")
          app = root / "app/build.gradle.kts"
          text = app.read_text()
          plugin = '    id("com.google.gms.google-services")'
          if plugin not in text:
              marker = '    id("org.jetbrains.kotlin.plugin.compose")'
              if marker not in text:
                  raise SystemExit("Kotlin Compose plugin marker not found")
              text = text.replace(marker, marker + nl + plugin, 1)
          deps = [
              '    implementation(platform("com.google.firebase:firebase-bom:34.4.0"))',
              '    implementation("com.google.firebase:firebase-auth")',
              '    implementation("com.google.firebase:firebase-database")',
              '    implementation("io.livekit:livekit-android:2.30.0")',
          ]
          for dep in deps:
              if dep not in text:
                  text = text.replace("dependencies {", "dependencies {" + nl + dep, 1)
          app.write_text(text)
          root_file = root / "build.gradle.kts"
          text = root_file.read_text()
          plugin = '    id("com.google.gms.google-services") version "4.4.2" apply false'
          if plugin not in text:
              marker = '    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false'
              if marker not in text:
                  raise SystemExit("Root Kotlin Compose plugin marker not found")
              text = text.replace(marker, marker + nl + plugin, 1)
          root_file.write_text(text)
          settings = root / "settings.gradle.kts"
          text = settings.read_text()
          if "jitpack.io" not in text:
              start = text.find("dependencyResolutionManagement")
              pos = text.find("repositories {", start)
              if start < 0 or pos < 0:
                  raise SystemExit("Dependency repositories block not found")
              pos += len("repositories {")
              text = text[:pos] + nl + '        maven("https://jitpack.io")' + text[pos:]
              settings.write_text(text)
          manifest = root / "app/src/main/AndroidManifest.xml"
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in text:
              text = text.replace("<application", permission + nl + "    <application", 1)
              manifest.write_text(text)
          gradle = root / "app/build.gradle.kts"
          text = gradle.read_text()
          patch = nl + 'android {' + nl + '    compileOptions {' + nl + '        sourceCompatibility = JavaVersion.VERSION_17' + nl + '        targetCompatibility = JavaVersion.VERSION_17' + nl + '    }' + nl + '}' + nl + 'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {' + nl + '    kotlinOptions.jvmTarget = "17"' + nl + '}' + nl
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in text:
              gradle.write_text(text.rstrip() + patch)
          print("Prepared LiveKit, Firebase Auth and microphone permission.")
          PY
      - name: Build debug APK
        working-directory: VoxMeet
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VoxMeet-LiveKit-Debug-APK
          path: VoxMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
