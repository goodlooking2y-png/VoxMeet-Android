name: Cloudflare Worker Check

on:
  push:
    branches: [ production/livekit-token-backend ]
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/worker-check.yml"
  pull_request:
    branches: [ work/bigo-live-ui ]
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/worker-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Worker
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM src/index.ts
      - name: Bundle Worker
        run: npx wrangler deploy --dry-run --outdir=dist
