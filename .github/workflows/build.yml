name: Build VoxMeet APK

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/premium-blue-ui ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q VoxMeet-mobile-cloud-build.zip

      - name: Configure Maven repositories
        working-directory: VoxMeet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = next((p for p in (Path("settings.gradle.kts"), Path("settings.gradle")) if p.is_file()), None)
          if settings is None:
              raise SystemExit("Could not find settings.gradle(.kts)")
          source = settings.read_text()
          if "https://jitpack.io" not in source:
              pattern = r"dependencyResolutionManagement\\s*\\{[\\s\\S]*?repositories\\s*\\{"
              match = re.search(pattern, source)
              if match:
                  insert = 'maven { url = uri("https://jitpack.io") }' if settings.suffix == ".kts" else 'maven { url "https://jitpack.io" }'
                  source = source[:match.end()] + "\\n        " + insert + source[match.end():]
              else:
                  if settings.suffix == ".kts":
                      source += '\\n\\ndependencyResolutionManagement {\\n    repositories {\\n        google()\\n        mavenCentral()\\n        maven { url = uri("https://jitpack.io") }\\n    }\\n}\\n'
                  else:
                      source += '\\n\\ndependencyResolutionManagement {\\n    repositories {\\n        google()\\n        mavenCentral()\\n        maven { url "https://jitpack.io" }\\n    }\\n}\\n'
              settings.write_text(source)
          print("JitPack repository configured in", settings)
          PY

      - name: Apply VoxMeet Premium Blue UI and required app components
        run: |
          mkdir -p VoxMeet/app/src/main/java/com/rakib/voxmeet
          cp overrides/MainActivity.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/MainActivity.kt
          cp overrides/AuthGate.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/AuthGate.kt
          cp overrides/LiveKitAudioManager.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/LiveKitAudioManager.kt

      - name: Set Java and Kotlin targets in the Android app module
        working-directory: VoxMeet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path("app/build.gradle"), Path("app/build.gradle.kts")]
          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("Could not find app/build.gradle or app/build.gradle.kts")
          print(f"Patching {build_file}")
          original = build_file.read_text()

          # The replacement UI uses Firebase Authentication and LiveKit SDKs (injected before compile).
          # Add the SDKs to the extracted app module before Kotlin compilation.
          import re
          if "com.google.firebase:firebase-auth" not in original:
              match = re.search(r"dependencies\s*\{", original)
              if not match:
                  raise SystemExit("Could not find dependencies block in app Gradle file")
              if build_file.suffix == ".kts":
                  deps = '''
              implementation(platform("com.google.firebase:firebase-bom:34.5.0"))
              implementation("com.google.firebase:firebase-auth")
              implementation("io.livekit:livekit-android:2.30.0")
          '''
              else:
                  deps = '''
              implementation platform("com.google.firebase:firebase-bom:34.5.0")
              implementation "com.google.firebase:firebase-auth"
              implementation "io.livekit:livekit-android:2.30.0"
          '''
              pos = match.end()
              original = original[:pos] + "\n" + deps + original[pos:]
              print("Added Firebase Auth and LiveKit dependencies")

          if build_file.suffix == ".kts":
              patch = """
          
          // Enforce matching bytecode targets for Java and Kotlin.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """
          else:
              patch = """
          
          // Enforce matching bytecode targets for Java and Kotlin.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = '17'
          }
          """
          build_file.write_text(original.rstrip() + "\n" + patch)
          print("Updated app module build configuration:")
          print(build_file.read_text())
          PY

      - name: Show Java version
        run: java -version

      - name: Build APK
        working-directory: VoxMeet
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VoxMeet-APK
          path: VoxMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
