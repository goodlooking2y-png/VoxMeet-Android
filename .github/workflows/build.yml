name: Build VoxMeet APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q VoxMeet-mobile-cloud-build.zip

      - name: Force Java compile tasks to JVM 17
        working-directory: VoxMeet
        run: |
          cat > jvm17.init.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.taskGraph.whenReady {
            allprojects.each { project ->
              project.tasks.withType(JavaCompile).each { task ->
                task.sourceCompatibility = '17'
                task.targetCompatibility = '17'
              }
            }
          }
          EOF

      - name: Build APK
        working-directory: VoxMeet
        run: gradle --init-script jvm17.init.gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VoxMeet-APK
          path: VoxMeet/app/build/outputs/apk/debug/app-debug.apk
