name: Build VoxMeet APK

on:
  workflow_dispatch:
  push:
    branches: [ main, work/bigo-live-ui ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q VoxMeet-mobile-cloud-build.zip

      - name: Apply VoxMeet LiveKit audio foundation
        run: |
          mkdir -p VoxMeet/app/src/main/java/com/rakib/voxmeet
          cp overrides/MainActivity.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/MainActivity.kt
          cp overrides/LiveKitAudioManager.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/LiveKitAudioManager.kt
          cp overrides/AuthGate.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/AuthGate.kt
          mkdir -p VoxMeet/app
          cp firebase/google-services.json VoxMeet/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("VoxMeet/app/build.gradle.kts")
          s = gradle.read_text()
          google_plugin = '    id("com.google.gms.google-services")'
          if google_plugin not in s:
              s = s.replace('    id("org.jetbrains.kotlin.plugin.compose")', '    id("org.jetbrains.kotlin.plugin.compose")\n' + google_plugin, 1)
          firebase_bom = '    implementation(platform("com.google.firebase:firebase-bom:34.4.0"))'
          firebase_auth = '    implementation("com.google.firebase:firebase-auth")'
          if firebase_bom not in s:
              s = s.replace("dependencies {", "dependencies {" + chr(10) + firebase_bom + chr(10) + firebase_auth, 1)
          root_gradle = Path("VoxMeet/build.gradle.kts")
          root_s = root_gradle.read_text()
          root_plugin = '    id("com.google.gms.google-services") version "4.4.2" apply false'
          if root_plugin not in root_s:
              root_s = root_s.replace('    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false', '    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false\n' + root_plugin, 1)
          root_gradle.write_text(root_s)
          dep = '    implementation("io.livekit:livekit-android:2.30.0")'
          if dep not in s:
              s = s.replace("dependencies {", "dependencies {" + chr(10) + dep, 1)
          gradle.write_text(s)

          # LiveKit's audioswitch dependency is published on JitPack.
          settings_candidates = [Path("VoxMeet/settings.gradle.kts"), Path("VoxMeet/settings.gradle")]
          settings = next((p for p in settings_candidates if p.is_file()), None)
          if settings is None:
              raise SystemExit("Could not find VoxMeet/settings.gradle(.kts)")
          cfg = settings.read_text()
          if "jitpack.io" not in cfg:
              marker = "dependencyResolutionManagement"
              start = cfg.find(marker)
              if start >= 0:
                  repo_start = cfg.find("repositories {", start)
                  if repo_start < 0:
                      raise SystemExit("Could not find dependencyResolutionManagement repositories block")
                  insert_at = repo_start + len("repositories {")
                  addition = chr(10) + '        maven("https://jitpack.io");' if settings.suffix == ".kts" else chr(10) + "        maven { url 'https://jitpack.io' }"
                  cfg = cfg[:insert_at] + addition + cfg[insert_at:]
              else:
                  raise SystemExit("Could not find dependencyResolutionManagement block for JitPack")
              settings.write_text(cfg)
          print("Configured JitPack in", settings)
          PY

      - name: Upload extracted source for review
        uses: actions/upload-artifact@v4
        with:
          name: VoxMeet-Source-Review
          path: VoxMeet/
          if-no-files-found: error

      - name: Set Java and Kotlin targets in the Android app module
        working-directory: VoxMeet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path("app/build.gradle"), Path("app/build.gradle.kts")]
          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("Could not find app/build.gradle or app/build.gradle.kts")
          print(f"Patching {build_file}")
          original = build_file.read_text()
          if build_file.suffix == ".kts":
              patch = """
          
          // Enforce matching bytecode targets for Java and Kotlin.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """
          else:
              patch = """
          
          // Enforce matching bytecode targets for Java and Kotlin.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = '17'
          }
          """
          build_file.write_text(original.rstrip() + "\n" + patch)
          print("Updated app module build configuration:")
          print(build_file.read_text())
          PY

      - name: Show Java version
        run: java -version

      - name: Build APK
        working-directory: VoxMeet
        run: gradle --no-daemon :app:assembleDebug

      - name: Export APK signing certificate fingerprints
        working-directory: VoxMeet
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in Android SDK build-tools" >&2
            exit 1
          fi
          mkdir -p fingerprint
          "$APKSIGNER" verify --print-certs "$APK" | tee fingerprint/apk-signing-certificate.txt
          grep -E 'certificate SHA-1 digest:|certificate SHA-256 digest:' fingerprint/apk-signing-certificate.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VoxMeet-APK-Fingerprints
          path: VoxMeet/fingerprint/apk-signing-certificate.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VoxMeet-APK
          path: VoxMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
