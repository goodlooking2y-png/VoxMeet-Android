name: Build VoxMeet APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q VoxMeet-mobile-cloud-build.zip

      - name: Configure Java compilation for JVM 17
        working-directory: VoxMeet
        run: |
          cat > jvm17.init.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile
          import org.gradle.api.JavaVersion

          gradle.beforeProject { project ->
            project.tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = JavaVersion.VERSION_17.toString()
              targetCompatibility = JavaVersion.VERSION_17.toString()
            }
          }
          EOF

      - name: Show Gradle and Java versions
        working-directory: VoxMeet
        run: |
          java -version
          gradle --version

      - name: Build APK
        working-directory: VoxMeet
        run: gradle --no-daemon --init-script jvm17.init.gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VoxMeet-APK
          path: VoxMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
