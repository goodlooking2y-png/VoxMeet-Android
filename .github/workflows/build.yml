name: Build VoxMeet APK

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/home-level-entry-ui ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q VoxMeet-profile-avatar-update.zip

      - name: Add Home Screen level and entry components
        run: |
          mkdir -p VoxMeet/app/src/main/java/com/rakib/voxmeet
          cp home-ui/LevelAndEntryComponents.kt VoxMeet/app/src/main/java/com/rakib/voxmeet/LevelAndEntryComponents.kt
          python3 - <<'PY'
          from pathlib import Path
          source = Path("VoxMeet/app/src/main/java/com/rakib/voxmeet/MainActivity.kt")
          text = source.read_text()
          marker = '''        item {
                      Card(colors = CardDefaults.cardColors(containerColor = Panel), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxWidth()) {'''
          if "item { LevelProgressCard() }" not in text:
              if marker not in text:
                  raise SystemExit("HomeScreen insertion point not found; refusing to alter source")
              text = text.replace(marker, '''        item { LevelProgressCard() }
                  item { EntryTierPreview() }
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = Panel), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxWidth()) {''', 1)
          source.write_text(text)
          print("Home Screen level and tier entry previews added")
          PY

      - name: Apply VoxMeet launcher icon
        run: |
          mkdir -p VoxMeet/app/src/main/res
          cp -R branding/res/. VoxMeet/app/src/main/res/
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("VoxMeet/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit("AndroidManifest.xml not found")
          text = manifest.read_text()
          if 'android:icon=' not in text:
              text = text.replace('<application ', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" ', 1)
          if 'android:icon=' not in text:
              raise SystemExit("Could not add application icon attribute")
          text = text.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@mipmap/ic_launcher"')
          manifest.write_text(text)
          print("VoxMeet launcher icon resources applied")
          PY

      - name: Set Java and Kotlin targets in the Android app module
        working-directory: VoxMeet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path("app/build.gradle"), Path("app/build.gradle.kts")]
          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("Could not find app/build.gradle or app/build.gradle.kts")
          print(f"Patching {build_file}")
          original = build_file.read_text()
          if build_file.suffix == ".kts":
              patch = """
          
          // Enforce matching bytecode targets for Java and Kotlin.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """
          else:
              patch = """
          
          // Enforce matching bytecode targets for Java and Kotlin.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = '17'
          }
          """
          build_file.write_text(original.rstrip() + "\n" + patch)
          print("Updated app module build configuration:")
          print(build_file.read_text())
          PY

      - name: Show Java version
        run: java -version

      - name: Build APK
        working-directory: VoxMeet
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VoxMeet-APK
          path: VoxMeet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
